<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Producto - Aminovita</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/lux/bootstrap.min.css" integrity="sha512-RgYivnvxINaQk1Yl88jIP++kmQgSz6rtxyhZ8bSZHFnhq3t4MlNOuUqX252yJwc4kSKl19Ej9dZ0cPvbqsp/kQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="icon" href="../assets/img/iconos/Logo aminovita.png" type="png">

    <style>
        html { background-color: #f8f9fa; }
        body { background-color: #f8f9fa; min-height: 100vh; }

        @keyframes softFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .body-interno { animation: softFade 0.6s ease-out forwards; opacity: 0; }
    </style>
</head>

<body class="body-interno d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <img src="../assets/img/iconos/AQ1.png" alt="Logo" style="height: 35px; width: auto;" class="me-2">
                AMINOVITA
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="./nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="./productos.html">Catálogo</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-danger me-3 d-none d-lg-block">MODO ADMIN</span>
                    <button class="btn btn-outline-danger btn-sm fw-bold" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="display-6 fw-bold" style="color: #0b2639;">Administrar Producto</h2>
                <p class="text-muted">Edita la información, categoría o gestiona notas internas.</p>
            </div>
            <a href="./productos.html" class="btn btn-outline-dark rounded-pill fw-bold">
                <i class="bi bi-arrow-left me-2"></i> Volver al Catálogo
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="card shadow border-0 overflow-hidden rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <form id="formEditar" class="needs-validation" novalidate>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Título del Producto</label>
                                    <input type="text" class="form-control bg-light border-0" id="titulo" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Sector / Industria</label>
                                    <select class="form-select bg-light border-0" id="categoria" required>
                                        <option value="Farmacéutica">Industria Farmacéutica</option>
                                        <option value="Alimentos">Industria Alimentaria</option>
                                        <option value="Cosmética">Industria Cosmética</option>
                                        <option value="General">Uso General / Otros</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted text-uppercase">Descripción / Especificaciones</label>
                                <textarea class="form-control bg-light border-0" id="descripcion" rows="4" required></textarea>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Fecha Creación</label>
                                    <input type="text" class="form-control bg-light border-0 text-muted" id="fecha" disabled readonly>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-muted text-uppercase">ID Sistema</label>
                                    <input type="text" class="form-control bg-light border-0 text-muted" id="idProd" disabled readonly>
                                </div>
                            </div>

                            <div class="mb-4 p-3 bg-warning-subtle rounded border border-warning">
                                <label class="form-label small fw-bold text-warning-emphasis mb-2">
                                    <i class="bi bi-lock-fill me-1"></i> NOTAS INTERNAS (PRIVADO)
                                </label>
                                <textarea class="form-control border-0" id="notas" rows="3" placeholder="Información de proveedores, stock, costos de importación..."></textarea>
                            </div>

                            <hr class="opacity-25 my-4">

                            <div class="d-flex gap-2 justify-content-end">
                                <button type="button" onclick="eliminarProducto()" class="btn btn-outline-danger rounded-pill px-4" title="Eliminar Producto">
                                    <i class="bi bi-trash-fill me-2"></i> Eliminar
                                </button>
                                <button type="submit" class="btn btn-dark fw-bold rounded-pill px-4">
                                    <i class="bi bi-save-fill me-2"></i> Guardar Cambios
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto text-center">
        <small>&copy; 2026 Aminovita y Químicos. Todos los derechos reservados.</small>
    </footer>

    <script src="../assets/js/auth.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const productoId = params.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            const rol = localStorage.getItem('usuarioRol');
            if (rol !== 'admin') {
                Swal.fire({
                    icon: 'error', title: 'Acceso Denegado', text: 'Solo administradores.',
                    confirmButtonText: 'Volver', allowOutsideClick: false
                }).then(() => window.location.href = './productos.html');
                return;
            }

            if (!productoId) {
                Swal.fire('Error', 'No se especificó ningún producto', 'error')
                    .then(() => window.location.href = './productos.html');
                return;
            }

            await cargarDatosProducto();
        });

        async function cargarDatosProducto() {
            try {
                const res = await fetch(`http://localhost:4000/api/productos/${productoId}`, {
                    headers: { 'x-auth-token': localStorage.getItem('token') }
                });
                
                if (!res.ok) throw new Error('Error al cargar');

                const prod = await res.json();

                // Llenar el formulario con los datos, incluyendo la Categoría
                document.getElementById('titulo').value = prod.titulo;
                document.getElementById('categoria').value = prod.categoria || 'General';
                document.getElementById('descripcion').value = prod.descripcion;
                
                document.getElementById('idProd').value = prod._id;
                document.getElementById('notas').value = prod.notas || ''; 

                const fechaObj = new Date(prod.fecha);
                document.getElementById('fecha').value = fechaObj.toLocaleDateString();

            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'No se pudo cargar la información del producto', 'error');
            }
        }

        // --- GUARDAR CAMBIOS ---
        document.getElementById('formEditar').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!document.getElementById('formEditar').checkValidity()) {
                e.stopPropagation();
                document.getElementById('formEditar').classList.add('was-validated');
                return;
            }

            Swal.fire({ title: 'Guardando...', didOpen: () => Swal.showLoading() });

            try {
                // Preparamos los datos sin imagen, usando categoría
                const datosActualizados = {
                    titulo: document.getElementById('titulo').value,
                    categoria: document.getElementById('categoria').value,
                    descripcion: document.getElementById('descripcion').value,
                    notas: document.getElementById('notas').value 
                };

                const res = await fetch(`http://localhost:4000/api/productos/${productoId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-auth-token': localStorage.getItem('token') 
                    },
                    body: JSON.stringify(datosActualizados)
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success', title: '¡Actualizado!',
                        text: 'Cambios guardados con éxito',
                        timer: 1500, showConfirmButton: false
                    }).then(() => window.location.href = './productos.html');
                } else {
                    Swal.fire('Error', 'No se pudo actualizar', 'error');
                }
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Fallo de conexión', 'error');
            }
        });

        // --- ELIMINAR ---
        async function eliminarProducto() {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                text: "El producto se borrará permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`http://localhost:4000/api/productos/${productoId}`, {
                        method: 'DELETE',
                        headers: { 'x-auth-token': localStorage.getItem('token') }
                    });

                    if (res.ok) {
                        await Swal.fire('Eliminado', 'Registro borrado.', 'success');
                        window.location.href = './productos.html';
                    } else {
                        Swal.fire('Error', 'No se pudo eliminar', 'error');
                    }
                } catch (error) {
                    console.error(error);
                    Swal.fire('Error', 'Fallo de conexión', 'error');
                }
            }
        }
    </script>
</body>
</html>
